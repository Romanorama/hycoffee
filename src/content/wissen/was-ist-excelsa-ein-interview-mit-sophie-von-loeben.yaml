title: 'Was ist Excelsa? Ein Interview mit Sophie von Loeben '
category: excelsa
contentDe:
  subtitle: >-
    Unsere Mit-Gründerin Sophie schreibt gerade ihren PhD zu Klimaanpassung im
    Kaffeesektor. In diesem Interview erklärt Sophie die Wissenschaft hinter der
    Klimaresilienz von Excelsa and was die Kaffeeart so besonders macht.
    HyCoffee arbeitet mit Landwirt:innen zusammen, um die Qualität von Excelsa
    zu verbessern und diesen unterschätzten Kaffee nach Europa zu bringen.
  blocks:
    - discriminant: subheading
      value:
        text: Was ist Excelsa-Kaffee?
    - discriminant: paragraph
      value:
        text: >-
          Excelsa ist eine von rund 133 bekannten Kaffeearten, neben den beiden
          bekanntesten Arten Arabica und Robusta (Canephora). Viele dieser
          weniger bekannten Arten besitzen interessante Eigenschaften, etwa eine
          hohe Trockenheitstoleranz, die den Kaffeesektor widerstandsfähiger
          gegen den Klimawandel machen könnte. Kommerziell genutzt werden die
          meisten davon aber bisher kaum.

          Arten ist Excelsa (botanischer Name: Coffea dewevrei), die
          ursprünglich aus Zentralafrika stammt. Die Pflanze sieht anders aus
          als gewohnt: größerer Baum, größere Blätter. Was Excelsa besonders
          macht, ist ihre Widerstandsfähigkeit gegen Trockenheit und Krankheiten
          bei gleichzeitig gutem Geschmack.

          Einen etablierten Markt gibt es bisher kaum, dennoch wird Excelsa in
          einigen Regionen angebaut. In Uganda, wo die Kaffeeart heimisch ist,
          geschieht das schon seit mehreren Generationen.
    - discriminant: subheading
      value:
        text: 'Warum wird Excelsa-Kaffee in Uganda angebaut? '
    - discriminant: paragraph
      value:
        text: >-
          In Uganda wird Excelsa hauptsächlich in Luweero und Zirobwe, etwa 1,5
          Autostunden nördlich der Hauptstadt Kampala angebaut, in einer
          Kaffeeregion die besonders heiß und trocken ist. Meistens wird Excelsa
          gemeinsam mit Robusta, sowie Nahrungsmittelpflanzen angebaut. Obwohl
          es bisher keine große Nachfrage für Excelsa-Kaffee gab, bevorzugen die
          Landwirt:inen diese Kaffeeart, da die Bäume als Dürre- und
          Hitzetoleranter wahrnehmen, sowie weniger mit Schädlingen und
          Krankheiten zu kämpfen haben. Außerdem sind Excelsabäume deutlich
          Ertragsreicher und können über das ganze Jahr hinweg geerntet werden.
          Die Haupterntezeit fällt in eine Zeit, in der Robusta nicht geerntet
          wird, in der jedoch Schulgelder fällig sind und sorgt somit für mehr
          Liquidität für die Haushalte.
    - discriminant: subheading
      value:
        text: Worin unterscheidet sich Excelsa von Arabica und Robusta?
    - discriminant: paragraph
      value:
        text: >-
          Die Excelsa-Pflanze unterscheidet sich in mehreren Punkten von Arabica
          und Robusta. Excelsa-Bäume können bis zu 20 Meter hoch werden und
          tragen sehr große Blätter von bis zu 42 cm Länge und 20 cm Breite,
          deutlich größer als bei Arabica und Robusta. Außerdem wächst Excelsa
          einzelstämmig, während Arabica und Robusta häufig mehrere Stämme
          ausbilden.

          Auch die Kaffeekirschen sind beim Excelsabaum wesentlich größer.
          Zusammen mit ihrer hohen natürlichen Süße verleiht das den Bohnen
          einen besonderen Geschmack. Zudem bleibt Excelsa auch bei höheren
          Temperaturen und längeren Trockenperioden produktiv, während Arabica
          und teilweise auch Robusta hier an ihre Grenzen stoßen. Gleichzeitig
          erzielt die Pflanze durch ihre Größe pro Baum Erträge von bis zu 300
          kg.
    - discriminant: subheading
      value:
        text: Was sind die größten Hürden, Excelsa marktfähig zu machen?
    - discriminant: paragraph
      value:
        text: >-
          Trotz des großen Potenzials, das die Wissenschaft in Excelsa sieht,
          gibt es noch einige Hürden auf dem Weg zu einer erfolgreichen
          Markteinführung.

          Begrenztes Wissen: Über ideale Anbau- und Verarbeitungsmethoden ist
          bislang nur wenig bekannt. Hier braucht es weitere Forschung und
          praktische Erfahrung.

          Aufwendige Ernte: Die Höhe der Bäume macht die Ernte arbeitsintensiv
          und erschwert eine effiziente Bewirtschaftung.

          Fehlende Qualitätsstandards: Bisher wurde Excelsa häufig gemeinsam mit
          Robusta als Massenware mit niedriger Qualität verkauft. Um das
          Potenzial von Excelsa auszuschöpfen, müssen klare Qualitätsstandards
          entwickelt und etabliert werden.

          Limitierte Verarbeitungsmethode: Da Excelsa in einer sehr trockenen
          Region angebaut wird, in der es nicht genug Wasser gibt um den Kaffee
          zu waschen (washed-Methode), kann er momentan nur getrocknet und
          anaerob fermentiert verarbeitet werden.

          Geringerer Outturn: Im Vergleich zu Arabica und Robusta ist der Anteil
          an verwertbarem Kaffee nach der Verarbeitung geringer, was zu höheren
          Verlusten führt und die Wirtschaftlichkeit beeinflusst.

          Marktpräferenz: Kaffee schmeckt für viele am liebsten so, wie sie ihn
          kennen. Neue Kaffeearten wie Excelsa bieten daher die Chance,
          Konsumentinnen und Konsumenten sowie Röstereien für unbekannte
          Geschmackswelten zu begeistern, etwa durch neue Röstungen und das
          Erzählen der spannenden Geschichte hinter der Bohne.
    - discriminant: subheading
      value:
        text: Warum wurde Excelsa bisher kaum konsumiert?
    - discriminant: paragraph
      value:
        text: >-
          Historisch ist die globale Kaffee-Wertschöpfungskette stark von der
          Nachfrage geprägt: Der Großteil des Kaffees wird im globalen Süden
          produziert und im globalen Norden konsumiert. Lange Zeit dominierte
          Arabica aufgrund seines bevorzugten Geschmacks. Vor etwa 150 Jahren
          führte jedoch ein massiver Ausbruch von Kaffeerost zu erheblichen
          Schäden bei Arabica, sodass die Branche eine widerstandsfähige
          Alternative benötigte. Diese fand sie in Robusta. Seitdem hat sich
          Robusta als wichtige Art etabliert und macht heute rund 40 % des
          weltweiten Kaffeekonsums aus. Mit dem Klimawandel entstehen neue
          Herausforderungen für die Kaffeeproduktion, und Excelsa rückt
          zunehmend in den Fokus. Excelsa ist wärme- und trockenresistenter,
          liefert hohe Erträge und wird schon in kleinen Mengen kultiviert.
          Damit könnte Excelsa eine entscheidende Rolle dabei spielen, die
          Kaffeeproduktion auch unter veränderten Klimabedingungen nachhaltig zu
          sichern.
    - discriminant: subheading
      value:
        text: Warum gilt Excelsa als klimaresilient?
    - discriminant: paragraph
      value:
        text: >-
          Excelsa kann bei höheren Temperaturen und geringerer Luftfeuchtigkeit
          wachsen als Arabica und Robusta und ist weniger anfällig für
          Schädlinge und Krankheiten. Wenn Excelsa zusammen mit Robusta oder
          Arabica angebaut wird, kann ein klimatischer Schock oft nur eine der
          Arten stark treffen, da sie unterschiedliche Anbauzyklen und somit
          Erntezeiten haben. Zudem liefert Excelsa höhere und verlässlichere
          Erträge, was den Landwirtinnen und Landwirten ein stabiles Einkommen
          und die Möglichkeit gibt, Rücklagen zu bilden.
    - discriminant: subheading
      value:
        text: Wie schmeckt Excelsa-Kaffee?
    - discriminant: paragraph
      value:
        text: >-
          Excelsa unterscheidet sich geschmacklich von Arabica und Robusta. Der
          Kaffee hat oft eine ausgeprägte Süße, die an Ahornsirup erinnert,
          sowie milchsäureartige Fermentationsnoten, ähnlich wie Joghurt oder
          Kefir. Weitere Geschmacksnoten können Blutorange und Schokolade sein.
    - discriminant: subheading
      value:
        text: Wie erhält HyCoffee Zugang zu Excelsa-Kaffee?
    - discriminant: paragraph
      value:
        text: >-
          Wir arbeiten in Zentraluganda mit der Uganda Coffee Farmers Alliance
          zusammen und kooperieren dort mit verschiedenen Kaffeekooperativen,
          die bereits Excelsa anbauen. Zu Beginn entsprach die Qualität von
          Excelsa noch nicht den Erwartungen europäischer Konsumenten und
          Konsumentinnen, da es bisher wenig Wissen über optimale Anbau- und
          Verarbeitungsmethoden gab, sowie keine Nachfrage für ein
          hochqualitatives Produkt. HyCoffee ist wirtschaftlicher Partner eines
          Forschungsprojekts, in dem optimale Anbau- und Verarbeitungsmethoden
          untersucht und umgesetzt werden, um ein Produkt zu entwickeln, das für
          den europäischen Markt interessant ist. Die Landwirte und
          Landwirtinnen bekommen Trainings, Erntehelfer, sowie Trocknungsplanen,
          Solartrockner und Fermentationsbehälter zur verbesserten Verarbeitung
          des Kaffees. Zusätzlich arbeiten wir mit ausgewählten Champion
          Farmers, die mit anaerober Fermentation experimentieren. Die
          wissenschaftliche Forschung ermöglicht die systematische Dokumentation
          des generierten Wissens. Die Erkenntnisse werden veröffentlicht und
          können später auch auf andere Regionen der Welt übertragen werden.
          HyCoffee ermöglicht den Marktzugang in Europa und bezahlt den
          Kooperativen Preise, die 200% über dem Marktpreis von Excelsa liegen,
          sowie eine zusätzliche Gewinnbeteiligung für anaerobe Kaffees.
    - discriminant: subheading
      value:
        text: Was ist der Unterschied zwischen Liberica und Excelsa?
    - discriminant: paragraph
      value:
        text: >-
          Bis vor Kurzem ging man davon aus, dass Excelsa (Coffea dewevrei)
          lediglich eine Varietät von Liberica (Coffea liberica) ist. Im August
          2025 wurde Excelsa jedoch in einer wissenschaftlichen Veröffentlichung
          als eigenständige Kaffeeart anerkannt (Davis et al. 2025). Das ist
          plausibel: Der Geschmack unterscheidet sich deutlich von Liberica,
          auch wenn die Bäume ähnlich aussehen.

          Auf den Betrieben, mit denen wir zusammenarbeiten, ist Excelsa sicher
          vertreten. Möglich ist, dass auch einige Liberica-Bäume darunter sind,
          da beide Pflanzen lokal unter demselben Namen „Kisansa“ bekannt und
          schwer zu unterscheiden sind. Anhand der Geschmacksprofile gehen wir
          jedoch davon aus, dass es sich beim Großteil des Kaffees, den wir
          einkaufen, um Excelsa handelt.
    - discriminant: subheading
      value:
        text: Wird Excelsa den Kaffeesektor vor dem Klimawandel retten?
    - discriminant: paragraph
      value:
        text: >-
          Excelsa ist keine alleinige Lösung, um den Kaffeesektor vor den Folgen
          des Klimawandels zu schützen. Doch alternative, widerstandsfähigere
          Kaffeearten sind ein wichtiger Baustein auf dem Weg zu einem
          zukunftsfähigen Kaffeeanbau. Ein Vorteil von Excelsa: Die Art wird
          bereits heute von von einigen Landwirten und Landwirtinnen angebaut.
          Auch andere Arten wie Stenophylla gelten als vielversprechend, werden
          bislang aber noch kaum kommerziell kultiviert. Gelingt es, solche
          Arten zu erhalten, könnten sie künftig mit Arabica oder Robusta
          gekreuzt werden, um widerstandsfähigere Sorten zu entwickeln.

          Natürlich gibt es noch weitere Wege, den Kaffeeanbau an den
          Klimawandel anzupassen, zum Beispiel klimaresiliente Anbausysteme wie
          Agroforst oder regenerative Landwirtschaft, in die wir ebenfalls
          investieren. Bei unseren Kaffees handelt es sich entweder um
          klimaresiliente Arten, gezüchteten widerstandsfähigen Sorten oder
          Kaffee, der in klimaresilienten Anbausystemen angebaut wird.
          Langfristig wird es eine Kombination aus all diesen Ansätzen brauchen,
          damit sich der Kaffeesektor erfolgreich an die Auswirkungen des
          Klimawandels anpassen kann.
contentEn:
  title: What is Excelsa? An Interview with Sophie von Loeben
  subtitle: >-
    Our co-founder Sophie is currently writing her PhD on climate change
    adaptation of coffee value chains. In this interview, she explains the
    science behind Excelsa's climate resilience and what makes this coffee
    species so special. HyCoffee works with farmers to improve the quality of
    Excelsa and bring this underrated coffee to Europe.
  blocks:
    - discriminant: subheading
      value:
        text: What is Excelsa coffee?
    - discriminant: paragraph
      value:
        text: >-
          Excelsa is one of around 133 known coffee species, alongside the two
          best-known species, Arabica and Robusta (Canephora). Many of these
          lesser-known species have interesting traits, such as high drought
          tolerance, that could make the coffee sector more resilient to climate
          change. So far, however, most of them are barely used commercially.

          One of these species is Excelsa (botanical name: Coffea dewevrei),
          which originates from the central African region. The plant looks
          quite different from what we're used to: a larger tree with larger
          leaves. What makes Excelsa special is its tolerance to higher
          temperatures, to drought and disease, combined with an interesting
          flavor profile.

          While there is currently barely an established market, Excelsa is
          already grown in several regions around the world. In Uganda, where
          the species is native, it has been cultivated for generations.
    - discriminant: subheading
      value:
        text: Why is Excelsa coffee grown in Uganda?
    - discriminant: paragraph
      value:
        text: >-
          In Uganda, Excelsa is grown mainly in Luweero and Zirobwe, a 1.5-hour
          drive north of the capital, Kampala, in a coffee-growing region known
          for high temperatures and dry soils. It's usually grown alongside
          Robusta as well as food crops. Although there has so far been little
          demand for Excelsa coffee, farmers favour the species because they
          perceive the trees as more drought- and heat-tolerant, and less prone
          to pests and disease. Excelsa trees are also significantly more
          productive and can be harvested year-round. The main harvest season
          falls at a time when Robusta is off-season, but school fees are due,
          providing households with much-needed liquidity.
    - discriminant: subheading
      value:
        text: How does Excelsa differ from Arabica and Robusta?
    - discriminant: paragraph
      value:
        text: >-
          The Excelsa plant differs from Arabica and Robusta in several ways.
          Excelsa trees can grow up to 20 meters tall and have very large
          leaves, up to 42 cm long and 20 cm wide, considerably bigger than
          those of Arabica or Robusta. Excelsa also grows as a single trunk,
          whereas Arabica and Robusta often develop multiple stems.

          The cherries on the Excelsa tree are much larger as well. Combined
          with their high natural sweetness, this gives the beans a distinctive
          flavor. Excelsa also remains productive under higher temperatures and
          longer dry spells, conditions under which Arabica, and to some extent
          Robusta, struggle. At the same time, thanks to height, the plant can
          produce up to 300 kg of coffee per tree.
    - discriminant: subheading
      value:
        text: What are the biggest obstacles to making Excelsa marketable?
    - discriminant: paragraph
      value:
        text: >-
          Despite the great potential that science sees in Excelsa, several
          hurdles still stand in the way of a successful market integration:

          Limited knowledge: Little is currently known about ideal cultivation
          and processing methods. This calls for further research and hands-on
          experience.

          Labour-intensive harvest: The height of the trees makes harvesting
          labour-intensive and complicates efficient farm management.

          Lack of quality standards: Excelsa has often been sold together with
          Robusta as low-quality bulk coffee. Unlocking its potential requires
          establishing clear quality standards and demand for high-quality
          Excelsa.

          Limited processing methods: Because Excelsa is grown in a very dry
          region in Uganda without enough water for washed processing, it can
          currently only be processed using dry and anaerobic fermentation
          methods.

          Lower outturn: Compared to Arabica and Robusta, the share of usable
          coffee after processing is lower, leading to higher losses and
          affecting overall profitability.
