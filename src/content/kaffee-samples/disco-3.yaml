contentDe:
  intro: >-
    Disco 3 ist ein Arabica-Spezialitätenkaffee aus der West-Nil-Region Ugandas,
    der von Produzent:innen, nahe der Grenze zur Demokratischen Republik Kongo,
    angebaut wird. Der Kaffee wird in der Jukia Mikrostation aufbereitet.  Dort
    verleiht eine anaerobe Fermentation dem Kaffee sein besonderes
    Geschmacksprofil. Nach der Ernte bringen die Produzent:innen ihre
    Kaffeekirschen zur Mikrostation, wo diese zunächst sortiert und für 72
    Stunden in luftdicht verschlossenen Behältern anaerob fermentiert werden.
    Anschließend wird der Kaffee auf erhöhten Trocknungsbetten getrocknet und
    sorgfältig von Hand sortiert. Das Ergebnis ist eine lebendige,
    ausdrucksstarke Tasse: spritzige Säure trifft auf reichhaltige Kakaonoten,
    warme Gewürze, prickelnde Cola und saftigen Pfirsich. 
  resilienceText: >-
    Klimaprognosen zufolge zählt die West-Nil-Region zu den Kaffeeanbaugebieten
    Ugandas, die künftig besonders stark von den Folgen des Klimawandels
    betroffen sein werden. Damit Kaffee auch in Zukunft eine verlässliche
    Einkommensque le für ländliche Haushalte bleibt, werden die ProduzentInnen
    dabei unterstützt, regenerative Anbaumethoden umzusetzen, beispielsweise
    durch die Herste lung und Anwendung von natürlichem Pflanzenschutzmittel
    sowie nährstoffreichem Kompost aus lokal verfügbaren Materialien wie
    Gesteinsmehl und Holzasche. Dies kann in einer der heißesten Regionen
    Ugandas dazu beitragen, die Bodenfruchtbarkeit zu verbessern und die
    Kaffeepflanzen widerstandsfähiger zu machen. Der Kaffee ist zudem nach JAS,
    dem japanischen Bio-Standard, als Bio-Produkt zertifiziert. Eine
    Zertifizierung nach EU-Bio-Standard ist aktuell aufgrund der Komplexit des
    Verfahrens noch nicht geplant. 
  socialText: >-
    Die West-Nil-Region zählt zu den wirtschaftlich benachteiligten Regionen
    Ugandas und hat vergleichsweise wenige Investitionen erhalten. Das
    Mikrostationsmode l trägt dazu bei, einen größeren Teil der Wertschöpfung in
    den lokalen Gemeinden zu halten: Jede Station wird von einem gewählten
    Komitee aus Produzent:innen geführt. Durch die Mikrostationen entstehen
    zudem Arbeitsplätze direkt in den Dörfern bzw. nah an den Farmen der
    Produzent:innen, wo sonst nur wenige Beschäftigungsmöglichkeiten bestehen.
    Für ihre Kaffeekirschen erhalten die Produzent:innen einen Preis, der 55 %
    über dem ugandischen Living-Income-Referenzpreis liegt, was zu einem
    stabilen Einkommen beiträgt. 
contentEn:
  intro: >-
    Disco 3 is a specialty Arabica from Uganda's West Nile region, grown on
    high-altitude slopes near the border with the Democratic Republic of Congo.
    Processed at the Jukia microstation, where experimental anaerobic
    fermentations push aroma boundaries, Disco 3 undergoes a 72-hour anaerobic
    fermentation. The beans are then naturally dried on raised beds and
    carefully hand-sorted. The result is a vivid, expressive cup with sparkling
    acidity and layered complexity: rich cocoa, warm spices, fizzy cola, and
    juicy peach.
  resilienceText: >-
    Climate projections show that coffee production in Uganda's West Nile region
    will be strongly affected by climate change. To keep coffee viable as an
    income source for rural households, farmers are supported in building
    regenerative growing systems with healthier soils, better water retention,
    and more shade. In one of Uganda's hottest regions, regenerative agriculture
    is a critical adaptation strategy and reduces dependence on costly synthetic
    fertilizers.
  socialText: >-
    The West Nile region has historically seen little investment. The
    microstation system keeps value creation with farmers, with each station
    operated by an elected committee. Farmers sell their cherries at two thirds
    above the living-income reference price for Ugandan Arabica, creating stable
    paid work in rural villages where employment opportunities are scarce.
